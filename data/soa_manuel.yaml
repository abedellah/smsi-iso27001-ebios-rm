# Décisions de la déclaration d'applicabilité pour les mesures de l'Annexe A qui ne sont rattachées
# ni à une règle du socle ni à une mesure du plan de traitement (celles-là sont calculées par tools/build.py).
# statut : implemented | partial | planned. base : risque | socle | légal | contractuel | bonne pratique.
# Les statuts sont des hypothèses cohérentes avec la maturité faible du cas (guide EBIOS RM p. 11).
decisions:
  "5.5": {statut: planned, base: [légal], pourquoi: "Établir les contacts pour notifier un incident : ANSSI et CERT-FR, autorités sanitaires, CNIL."}
  "5.6": {statut: planned, base: [bonne pratique], pourquoi: "Rejoindre une communauté de veille du secteur santé et pharmaceutique."}
  "5.7": {statut: planned, base: [bonne pratique], pourquoi: "Veille sur la menace cybercriminelle et activiste, que la direction demande de surveiller (guide EBIOS RM p. 81)."}
  "5.8": {statut: planned, base: [bonne pratique], pourquoi: "Intégrer la sécurité dans les projets, dont la modernisation des systèmes industriels."}
  "5.13": {statut: planned, base: [bonne pratique], pourquoi: "Marquer les documents et données de R&D selon leur confidentialité."}
  "5.32": {statut: partial, base: [légal], pourquoi: "Protéger les droits sur les travaux de R&D (secrets industriels, brevets) et respecter les licences."}
  "5.37": {statut: planned, base: [bonne pratique], pourquoi: "Documenter les procédures d'exploitation : sauvegarde, mise à jour, administration."}
  "6.1": {statut: partial, base: [légal, bonne pratique], pourquoi: "Vérifications à l'embauche proportionnées au poste, dans le cadre du droit du travail."}
  "6.2": {statut: partial, base: [contractuel], pourquoi: "La charte informatique existe (guide EBIOS RM p. 11) ; il reste à inscrire les obligations de sécurité dans les contrats."}
  "6.4": {statut: planned, base: [bonne pratique], pourquoi: "Prévoir la sanction des manquements graves aux règles de sécurité."}
  "6.6": {statut: partial, base: [bonne pratique], pourquoi: "Accords de confidentialité avec les salariés, les universités et les laboratoires."}
  "7.4": {statut: planned, base: [bonne pratique], pourquoi: "Surveiller les accès aux bâtiments et aux zones de R&D et de production."}
  "7.5": {statut: partial, base: [bonne pratique], pourquoi: "Protection contre l'incendie et l'eau des locaux techniques et de production."}
  "7.6": {statut: partial, base: [bonne pratique], pourquoi: "Règles de travail dans les zones de production et de R&D à accès restreint."}
  "7.7": {statut: planned, base: [bonne pratique], pourquoi: "Bureau propre et verrouillage automatique des écrans."}
  "7.8": {statut: partial, base: [bonne pratique], pourquoi: "Placer et protéger les équipements hors de la vue et de l'accès du public."}
  "7.11": {statut: partial, base: [bonne pratique], pourquoi: "Alimentation électrique secourue et climatisation des salles serveurs."}
  "7.12": {statut: planned, base: [bonne pratique], pourquoi: "Protéger le câblage réseau et électrique contre l'interception et les dégradations."}
  "7.14": {statut: planned, base: [bonne pratique], pourquoi: "Effacer ou détruire les supports avant mise au rebut, avec traçabilité."}
  "8.6": {statut: planned, base: [bonne pratique], pourquoi: "Surveiller la capacité des serveurs et du réseau, notamment en pic d'épidémie."}
  "8.10": {statut: planned, base: [légal], pourquoi: "Supprimer les données personnelles à la fin de leur durée de conservation."}
  "8.11": {statut: planned, base: [légal], pourquoi: "Pseudonymiser les données personnelles des essais cliniques hors des usages qui l'exigent."}
  "8.26": {statut: planned, base: [bonne pratique], pourquoi: "Exigences de sécurité dans les cahiers des charges des applications et systèmes acquis."}
  "8.27": {statut: planned, base: [bonne pratique], pourquoi: "Principes d'architecture sécurisée pour le SI et le système industriel (moindre privilège, défense en profondeur)."}
  "8.29": {statut: planned, base: [bonne pratique], pourquoi: "Tests de sécurité à la recette des systèmes acquis ou modifiés."}
  "8.31": {statut: planned, base: [bonne pratique], pourquoi: "Séparer les environnements de test et de production de l'ERP et des systèmes industriels."}
  "8.32": {statut: partial, base: [légal], pourquoi: "Le contrôle des changements existe côté qualité pharmaceutique ; il reste à y ajouter le volet sécurité."}
  "8.33": {statut: planned, base: [bonne pratique], pourquoi: "Protéger les données utilisées pour les tests, en particulier les données personnelles."}
exclusions:
  "8.4": {pourquoi: "L'entreprise ne développe pas de logiciel : il n'y a pas de code source à protéger (hypothèse de ce cas).", approuve_par: "Direction générale"}
  "8.25": {pourquoi: "Aucun cycle de développement logiciel : l'ERP et les systèmes industriels sont des produits acquis.", approuve_par: "Direction générale"}
  "8.28": {pourquoi: "Aucun code n'est écrit par l'entreprise.", approuve_par: "Direction générale"}
  "8.30": {pourquoi: "Aucun développement n'est externalisé. Les prestations du prestataire informatique relèvent des mesures 5.19 à 5.22.", approuve_par: "Direction générale"}
