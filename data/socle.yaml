# Socle de sécurité (EBIOS RM, atelier 1) : état d'application des 42 règles du
# Guide d'hygiène informatique de l'ANSSI (v2.0, septembre 2017, Licence Ouverte Etalab V1).
# Les 42 intitulés viennent du guide (outil de suivi, pp. 60-65).
# L'état d'application est évalué au niveau « standard ».
#   vert   : appliqué sans restriction
#   orange : appliqué avec restrictions
#   rouge  : non appliqué
# source : ce qui justifie l'état. "ANSSI-EBIOS p. N" = le guide EBIOS RM le laisse entendre.
#          "Hypothèse" = choisi par ce projet, cohérent avec la maturité faible du cas (EBIOS p. 11).
# iso : mesures de l'Annexe A de l'ISO/IEC 27001:2022 rapprochées de la règle (analyse de ce projet).
rules:
  # I. Sensibiliser et former
  - {id: 1, section: "I. Sensibiliser et former", titre: "Former les équipes opérationnelles à la sécurité des systèmes d'information", etat: rouge, ecart: "Aucune formation à la sécurité pour la DSI et les équipes de production", source: "Hypothèse", iso: ["6.3"]}
  - {id: 2, section: "I. Sensibiliser et former", titre: "Sensibiliser les utilisateurs aux bonnes pratiques élémentaires de sécurité informatique", etat: orange, ecart: "Sensibilisation faite à la prise de poste seulement, ni régulière ni centrée sur l'hameçonnage ; une charte informatique existe", source: "ANSSI-EBIOS p. 11, p. 77", iso: ["6.3", "5.10"]}
  - {id: 3, section: "I. Sensibiliser et former", titre: "Maîtriser les risques de l'infogérance", etat: rouge, ecart: "Le prestataire informatique a des droits d'accès élevés et une sécurité faible ; les contrats n'imposent pas de niveau de sécurité", source: "ANSSI-EBIOS p. 67, p. 77", iso: ["5.19", "5.20", "5.21", "5.22", "5.23"]}
  # II. Connaître le système d'information
  - {id: 4, section: "II. Connaître le système d'information", titre: "Identifier les informations et serveurs les plus sensibles et maintenir un schéma du réseau", etat: orange, ecart: "Les valeurs métier et leurs supports sont identifiés (atelier 1) ; pas de schéma réseau à jour", source: "Hypothèse", iso: ["5.9", "5.12"]}
  - {id: 5, section: "II. Connaître le système d'information", titre: "Disposer d'un inventaire exhaustif des comptes privilégiés et le maintenir à jour", etat: rouge, ecart: "Pas d'inventaire des comptes privilégiés, dont celui du prestataire informatique", source: "Hypothèse", iso: ["8.2", "5.16", "5.18"]}
  - {id: 6, section: "II. Connaître le système d'information", titre: "Organiser les procédures d'arrivée, de départ et de changement de fonction des utilisateurs", etat: orange, ecart: "Procédure RH existante, sans lien systématique avec la suppression des accès informatiques", source: "Hypothèse", iso: ["5.11", "5.18", "6.5"]}
  - {id: 7, section: "II. Connaître le système d'information", titre: "Autoriser la connexion au réseau de l'entité aux seuls équipements maîtrisés", etat: rouge, ecart: "Aucun contrôle des équipements qui se connectent au réseau", source: "Hypothèse", iso: ["5.9", "8.1", "8.20"]}
  # III. Authentifier et contrôler les accès
  - {id: 8, section: "III. Authentifier et contrôler les accès", titre: "Identifier nommément chaque personne accédant au système et distinguer les rôles utilisateur/administrateur", etat: orange, ecart: "Un compte administrateur non nominatif existe pour l'ERP", source: "ANSSI-EBIOS p. 30", iso: ["5.15", "5.16"]}
  - {id: 9, section: "III. Authentifier et contrôler les accès", titre: "Attribuer les bons droits sur les ressources sensibles du système d'information", etat: orange, ecart: "Un salarié de la R&D récupère facilement les informations depuis son poste, sans supervision", source: "ANSSI-EBIOS p. 64", iso: ["5.15", "5.18", "8.3"]}
  - {id: 10, section: "III. Authentifier et contrôler les accès", titre: "Définir et vérifier des règles de choix et de dimensionnement des mots de passe", etat: orange, ecart: "Règles inscrites dans la charte informatique, non vérifiées techniquement", source: "Hypothèse", iso: ["5.17", "8.5"]}
  - {id: 11, section: "III. Authentifier et contrôler les accès", titre: "Protéger les mots de passe stockés sur les systèmes", etat: rouge, ecart: "Mots de passe conservés sans protection particulière sur certains systèmes", source: "Hypothèse", iso: ["5.17", "8.24"]}
  - {id: 12, section: "III. Authentifier et contrôler les accès", titre: "Changer les éléments d'authentification par défaut sur les équipements et services", etat: orange, ecart: "Éléments par défaut changés sur le réseau bureautique, pas sur les équipements industriels", source: "Hypothèse", iso: ["5.17", "8.9"]}
  - {id: 13, section: "III. Authentifier et contrôler les accès", titre: "Privilégier lorsque c'est possible une authentification forte", etat: rouge, ecart: "Aucune authentification forte, y compris pour l'administration et les accès distants", source: "Hypothèse", iso: ["8.5"]}
  # IV. Sécuriser les postes
  - {id: 14, section: "IV. Sécuriser les postes", titre: "Mettre en place un niveau de sécurité minimal sur l'ensemble du parc informatique", etat: rouge, ecart: "Niveau de sécurité des postes hétérogène ; correctifs appliqués sans rigueur", source: "ANSSI-EBIOS p. 64", iso: ["8.1", "8.7", "8.9"]}
  - {id: 15, section: "IV. Sécuriser les postes", titre: "Se protéger des menaces relatives à l'utilisation de supports amovibles", etat: rouge, ecart: "Les ports USB ne sont soumis à aucune restriction", source: "ANSSI-EBIOS p. 64", iso: ["7.10"]}
  - {id: 16, section: "IV. Sécuriser les postes", titre: "Utiliser un outil de gestion centralisée afin d'homogénéiser les politiques de sécurité", etat: orange, ecart: "Gestion centralisée sur une partie du parc bureautique seulement", source: "Hypothèse", iso: ["8.9", "8.1"]}
  - {id: 17, section: "IV. Sécuriser les postes", titre: "Activer et configurer le pare-feu local des postes de travail", etat: orange, ecart: "Pare-feu local activé avec la configuration par défaut", source: "Hypothèse", iso: ["8.1", "8.20"]}
  - {id: 18, section: "IV. Sécuriser les postes", titre: "Chiffrer les données sensibles transmises par voie Internet", etat: rouge, ecart: "Les échanges de données avec les laboratoires ne sont pas chiffrés", source: "ANSSI-EBIOS p. 77", iso: ["5.14", "8.24"]}
  # V. Sécuriser le réseau
  - {id: 19, section: "V. Sécuriser le réseau", titre: "Segmenter le réseau et mettre en place un cloisonnement entre ces zones", etat: rouge, ecart: "Pas de cloisonnement entre les réseaux internes, dont la R&D", source: "ANSSI-EBIOS p. 64", iso: ["8.22"]}
  - {id: 20, section: "V. Sécuriser le réseau", titre: "S'assurer de la sécurité des réseaux d'accès Wi-Fi et de la séparation des usages", etat: orange, ecart: "Wi-Fi invité distinct, mais chiffrement et authentification non revus", source: "Hypothèse", iso: ["8.20", "8.21", "8.22"]}
  - {id: 21, section: "V. Sécuriser le réseau", titre: "Utiliser des protocoles sécurisés dès qu'ils existent", etat: orange, ecart: "Protocoles en clair encore utilisés en interne", source: "Hypothèse", iso: ["8.21", "8.24"]}
  - {id: 22, section: "V. Sécuriser le réseau", titre: "Mettre en place une passerelle d'accès sécurisé à Internet", etat: orange, ecart: "Pare-feu de périmètre présent, sans filtrage des contenus", source: "Hypothèse", iso: ["8.20", "8.23"]}
  - {id: 23, section: "V. Sécuriser le réseau", titre: "Cloisonner les services visibles depuis Internet du reste du système d'information", etat: orange, ecart: "Peu de services exposés, mais sans zone démilitarisée dédiée", source: "Hypothèse", iso: ["8.22", "8.20"]}
  - {id: 24, section: "V. Sécuriser le réseau", titre: "Protéger sa messagerie professionnelle", etat: orange, ecart: "Filtrage antispam de base ; un hameçonnage ciblé sur la messagerie des RH est jugé faisable", source: "ANSSI-EBIOS p. 64", iso: ["5.14", "8.7", "8.23"]}
  - {id: 25, section: "V. Sécuriser le réseau", titre: "Sécuriser les interconnexions réseau dédiées avec les partenaires", etat: rouge, ecart: "Interconnexions avec les laboratoires et le prestataire sans filtrage ni chiffrement", source: "ANSSI-EBIOS p. 54, p. 77", iso: ["5.14", "8.21", "8.20"]}
  - {id: 26, section: "V. Sécuriser le réseau", titre: "Contrôler et protéger l'accès aux salles serveurs et aux locaux techniques", etat: orange, ecart: "Accès aux salles serveurs par badge, sans revue des droits ; le personnel d'entretien circule librement dans les bureaux", source: "ANSSI-EBIOS p. 64", iso: ["7.1", "7.2", "7.3"]}
  # VI. Sécuriser l'administration
  - {id: 27, section: "VI. Sécuriser l'administration", titre: "Interdire l'accès à Internet depuis les postes ou serveurs utilisés pour l'administration du système d'information", etat: rouge, ecart: "Les administrateurs utilisent leur poste habituel, avec accès à Internet", source: "Hypothèse", iso: ["8.2", "8.23"]}
  - {id: 28, section: "VI. Sécuriser l'administration", titre: "Utiliser un réseau dédié et cloisonné pour l'administration du système d'information", etat: rouge, ecart: "Pas de réseau d'administration dédié", source: "Hypothèse", iso: ["8.22", "8.2"]}
  - {id: 29, section: "VI. Sécuriser l'administration", titre: "Limiter au strict besoin opérationnel les droits d'administration sur les postes de travail", etat: rouge, ecart: "De nombreux utilisateurs disposent de droits d'administration locaux", source: "Hypothèse", iso: ["8.2", "8.18"]}
  # VII. Gérer le nomadisme
  - {id: 30, section: "VII. Gérer le nomadisme", titre: "Prendre des mesures de sécurisation physique des terminaux nomades", etat: orange, ecart: "Câbles antivol et consignes de base pour certains déplacements", source: "Hypothèse", iso: ["7.9", "7.10"]}
  - {id: 31, section: "VII. Gérer le nomadisme", titre: "Chiffrer les données sensibles, en particulier sur le matériel potentiellement perdable", etat: rouge, ecart: "Disques des portables non chiffrés", source: "Hypothèse", iso: ["8.24", "7.9"]}
  - {id: 32, section: "VII. Gérer le nomadisme", titre: "Sécuriser la connexion réseau des postes utilisés en situation de nomadisme", etat: orange, ecart: "Accès distant par VPN sans authentification forte", source: "Hypothèse", iso: ["6.7", "8.20", "8.21"]}
  - {id: 33, section: "VII. Gérer le nomadisme", titre: "Adopter des politiques de sécurité dédiées aux terminaux mobiles", etat: rouge, ecart: "Aucune politique pour les téléphones et tablettes", source: "Hypothèse", iso: ["8.1", "6.7"]}
  # VIII. Maintenir à jour le système d'information
  - {id: 34, section: "VIII. Maintenir à jour le système d'information", titre: "Définir une politique de mise à jour des composants du système d'information", etat: rouge, ecart: "Manque de rigueur dans l'application des correctifs de sécurité, noté à maintes reprises", source: "ANSSI-EBIOS p. 64", iso: ["8.8", "8.19"]}
  - {id: 35, section: "VIII. Maintenir à jour le système d'information", titre: "Anticiper la fin de la maintenance des logiciels et systèmes et limiter les adhérences logicielles", etat: rouge, ecart: "Systèmes de production anciens, fin de support non suivie", source: "Hypothèse", iso: ["8.8", "7.13"]}
  # IX. Superviser, auditer, réagir
  - {id: 36, section: "IX. Superviser, auditer, réagir", titre: "Activer et configurer les journaux des composants les plus importants", etat: rouge, ecart: "Aucune supervision des actions ; journaux non centralisés", source: "ANSSI-EBIOS p. 64, p. 77", iso: ["8.15", "8.16", "8.17"]}
  - {id: 37, section: "IX. Superviser, auditer, réagir", titre: "Définir et appliquer une politique de sauvegarde des composants critiques", etat: rouge, ecart: "La politique de sauvegarde est en cours de rédaction par un groupe de travail", source: "ANSSI-EBIOS p. 30", iso: ["8.13"]}
  - {id: 38, section: "IX. Superviser, auditer, réagir", titre: "Procéder à des contrôles et audits de sécurité réguliers puis appliquer les actions correctives associées", etat: rouge, ecart: "Aucun audit de sécurité technique ou organisationnel du SI bureautique", source: "ANSSI-EBIOS p. 77", iso: ["5.35", "5.36", "8.34"]}
  - {id: 39, section: "IX. Superviser, auditer, réagir", titre: "Désigner un référent en sécurité des systèmes d'information et le faire connaître auprès du personnel", etat: vert, ecart: "", source: "ANSSI-EBIOS p. 77 (un RSSI existe)", iso: ["5.2"]}
  - {id: 40, section: "IX. Superviser, auditer, réagir", titre: "Définir une procédure de gestion des incidents de sécurité", etat: rouge, ecart: "Pas de procédure formalisée de gestion des incidents", source: "Hypothèse", iso: ["5.24", "5.25", "5.26", "5.27", "6.8"]}
  # X. Pour aller plus loin
  - {id: 41, section: "X. Pour aller plus loin", titre: "Mener une analyse de risques formelle", etat: orange, ecart: "Analyse EBIOS RM en cours (ce projet) ; cycle stratégique et cycle opérationnel à installer", source: "Original", iso: []}
  - {id: 42, section: "X. Pour aller plus loin", titre: "Privilégier l'usage de produits et de services qualifiés par l'ANSSI", etat: orange, ecart: "Un audit par un prestataire qualifié (PASSI) est prévu, pas d'autre usage de produits qualifiés", source: "ANSSI-EBIOS p. 77", iso: ["5.21", "5.23"]}
