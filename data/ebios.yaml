# Données de l'étude EBIOS RM. Sources : "ANSSI-EBIOS p. N" = guide EBIOS RM (pages imprimées),
# "Original" = travail de ce projet, "Hypothèse" = choix à discuter.
# Les gravités et vraisemblances suivent les échelles G1-G4 et V1-V4 du guide (pp. 26 et 66).

cycles:
  strategique: "3 ans"
  operationnel: "12 mois"
  t0: 2026-10-01   # Hypothèse : début du plan de traitement, sert à dater les échéances

niveaux_risque:   # score = gravité x vraisemblance ; classes d'acceptabilité du guide (p. 74)
  - {nom: Faible, min: 1, max: 3, decision: "Acceptable en l'état"}
  - {nom: Moyen, min: 4, max: 7, decision: "Tolérable sous contrôle : suivi et amélioration continue"}
  - {nom: Élevé, min: 8, max: 16, decision: "Inacceptable : mesures de réduction à court terme, ou acceptation formelle par la direction"}

valeurs_metier:
  - {id: VM1, nom: "Recherche et développement (R&D)", nature: Processus, proprietaire: Pharmacien, source: "ANSSI-EBIOS p. 22"}
  - {id: VM2, nom: "Fabriquer des vaccins", nature: Processus, proprietaire: "Responsable production", source: "ANSSI-EBIOS p. 22"}
  - {id: VM3, nom: "Traçabilité et contrôle", nature: Information, proprietaire: "Responsable qualité", source: "ANSSI-EBIOS p. 22"}

biens_supports:
  - {id: BS1, nom: "Serveurs bureautiques internes (R&D)", proprietaire: DSI, valeurs: [VM1], source: "ANSSI-EBIOS p. 22"}
  - {id: BS2, nom: "Serveurs bureautiques externes (R&D)", proprietaire: Laboratoires, valeurs: [VM1], source: "ANSSI-EBIOS p. 22"}
  - {id: BS3, nom: "Systèmes de production des antigènes", proprietaire: Laboratoires, valeurs: [VM1], source: "ANSSI-EBIOS p. 22"}
  - {id: BS4, nom: "Systèmes de production", proprietaire: "DSI et fournisseurs de matériel", valeurs: [VM2], source: "ANSSI-EBIOS p. 22"}
  - {id: BS5, nom: "Serveurs bureautiques internes (traçabilité)", proprietaire: DSI, valeurs: [VM3], source: "ANSSI-EBIOS p. 22"}

evenements_redoutes:
  - {id: ER1, vm: VM1, libelle: "Perte ou destruction des informations d'études et recherches, avec fort impact sur les futures autorisations de mise sur le marché", gravite: 3, source: "ANSSI-EBIOS p. 27"}
  - {id: ER2, vm: VM1, libelle: "Altération des informations d'études et recherches aboutissant à une formule de vaccin erronée", gravite: 3, source: "ANSSI-EBIOS p. 27"}
  - {id: ER3, vm: VM1, libelle: "Fuite des informations d'études et recherches de l'entreprise", gravite: 3, source: "ANSSI-EBIOS p. 27"}
  - {id: ER4, vm: VM1, libelle: "Interruption des phases de tests des vaccins pendant plus d'une semaine", gravite: 2, source: "ANSSI-EBIOS p. 27"}
  - {id: ER5, vm: VM2, libelle: "Fuite du savoir-faire concernant le processus de fabrication et les tests qualité", gravite: 2, source: "ANSSI-EBIOS p. 27"}
  - {id: ER6, vm: VM2, libelle: "Interruption de la production ou de la distribution de vaccins pendant plus d'une semaine pendant un pic d'épidémie", gravite: 4, source: "ANSSI-EBIOS p. 27"}
  - {id: ER7, vm: VM3, libelle: "Altération des résultats des contrôles qualité aboutissant à une non-conformité sanitaire", gravite: 4, source: "ANSSI-EBIOS p. 27"}
  - {id: ER8, vm: VM3, libelle: "Indisponibilité prolongée des données de traçabilité et de contrôle, qui bloque la libération des lots", gravite: 3, source: "Original"}
  - {id: ER9, vm: VM1, libelle: "Divulgation de données personnelles liées aux essais cliniques ou aux salariés", gravite: 3, source: "Original"}

# Atelier 2. Cotations qualitatives des 4 premiers couples : guide p. 39.
couples_sr_ov:
  - {id: SO1, sr: Activiste, ov: "Saboter la prochaine campagne nationale de vaccination en perturbant la production ou la distribution des vaccins, pour générer un choc psychologique et discréditer les pouvoirs publics", motivation: Significative, ressources: Modérée, activite: Modérée, pertinence: Moyenne, retenu: true, er: ER6, source: "ANSSI-EBIOS p. 39", justification: "Regain d'activité médiatique de groupes anti-vaccins lors de la campagne de vaccination antigrippale (p. 40)"}
  - {id: SO2, sr: Concurrent, ov: "Voler des informations en espionnant les travaux de R&D en vue d'obtenir un avantage concurrentiel", motivation: Importante, ressources: Significative, activite: Importante, pertinence: Élevée, retenu: true, er: ER3, source: "ANSSI-EBIOS p. 39", justification: "Publication annonçant l'aboutissement imminent d'un vaccin sur lequel les concurrents sont en compétition acharnée (p. 40)"}
  - {id: SO3, sr: Activiste, ov: "Divulguer au grand public des informations sur la conception des vaccins (photos et vidéos des tests animaliers)", motivation: Modérée, ressources: Faible, activite: Faible, pertinence: Faible, retenu: false, er: ER3, source: "ANSSI-EBIOS p. 39", justification: "Deux intrusions d'activistes dans des abattoirs dans l'année, aucune dans un laboratoire (p. 40). Écarté au premier cycle, à surveiller"}
  - {id: SO4, sr: Cybercriminel, ov: "Menace d'altération de la composition des vaccins distribués lors d'une campagne, sous couvert de bioterrorisme, à des fins d'extorsion", motivation: Modérée, ressources: Modérée, activite: Faible, pertinence: Faible, retenu: false, er: ER7, source: "ANSSI-EBIOS p. 39", justification: "Hausse des rançongiciels mais peu de cas avérés sur un système industriel (p. 40). Écarté au premier cycle ; la direction le met sous surveillance (p. 81)"}
  - {id: SO5, sr: Cybercriminel, ov: "Chiffrer les systèmes de l'entreprise (rançongiciel) pour paralyser la production et obtenir une rançon", motivation: Importante, ressources: Significative, activite: Importante, pertinence: Élevée, retenu: true, er: ER6, source: "Original", justification: "Objectif purement financier, attaque opportuniste et industrialisée, qui n'exige aucune connaissance du vaccin. Le socle de sécurité est faible (une seule règle du Guide d'hygiène est pleinement appliquée) et la direction juge la menace cybercriminelle préoccupante (p. 81)"}

# Atelier 3. Dangerosité = (dépendance x pénétration) / (maturité cyber x confiance), échelles 1 à 4.
# Seuils de zones du guide (p. 47) : veille 0,2 ; contrôle 0,9 ; danger 2,5.
# Les composantes des trois parties prenantes critiques sont reconstituées pour retrouver exactement
# les niveaux de menace donnés par le guide (p. 54) ; les autres sont des hypothèses.
zones: {veille: 0.2, controle: 0.9, danger: 2.5}
parties_prenantes:
  - {id: C1, categorie: Client, nom: "Établissements de santé", dependance: 2, penetration: 1, maturite: 3, confiance: 3, critique: false, source: "ANSSI-EBIOS p. 46 (liste), Hypothèse (cotation)"}
  - {id: C2, categorie: Client, nom: "Pharmacies", dependance: 1, penetration: 1, maturite: 2, confiance: 3, critique: false, source: "ANSSI-EBIOS p. 46 (liste), Hypothèse (cotation)"}
  - {id: C3, categorie: Client, nom: "Dépositaires et grossistes répartiteurs", dependance: 2, penetration: 2, maturite: 3, confiance: 3, critique: false, source: "ANSSI-EBIOS p. 46 (liste), Hypothèse (cotation)"}
  - {id: P1, categorie: Partenaire, nom: "Universités", dependance: 2, penetration: 2, maturite: 2, confiance: 2, critique: false, note: "Zone de contrôle, non retenue comme critique par le responsable projet (p. 47)", source: "ANSSI-EBIOS p. 47, Hypothèse (cotation)"}
  - {id: P2, categorie: Partenaire, nom: "Régulateurs", dependance: 3, penetration: 2, maturite: 4, confiance: 4, critique: false, source: "ANSSI-EBIOS p. 46 (liste), Hypothèse (cotation)"}
  - {id: P3, categorie: Partenaire, nom: "Laboratoires", dependance: 3, penetration: 3, maturite: 2, confiance: 2, critique: true, apres: {penetration: 2}, source: "ANSSI-EBIOS p. 47, p. 54 (2,25 puis 1,5)"}
  - {id: F1, categorie: Prestataire, nom: "Fournisseurs industriels chimistes", dependance: 3, penetration: 2, maturite: 3, confiance: 2, critique: false, note: "Zone de contrôle, non retenue comme critique (p. 47)", source: "ANSSI-EBIOS p. 47, Hypothèse (cotation)"}
  - {id: F2, categorie: Prestataire, nom: "Fournisseurs de matériel de production", dependance: 2, penetration: 3, maturite: 1, confiance: 3, critique: true, apres: {penetration: 2}, source: "ANSSI-EBIOS p. 47, p. 54 (2 puis 1,3)"}
  - {id: F3, categorie: Prestataire, nom: "Prestataire informatique", dependance: 3, penetration: 4, maturite: 2, confiance: 2, critique: true, apres: {maturite: 3}, source: "ANSSI-EBIOS p. 47, p. 54 (3 puis 2)"}

scenarios_strategiques:
  - {id: SS1, so: SO2, gravite: 3, source: "ANSSI-EBIOS p. 50",
     libelle: "Un concurrent vole des travaux de recherche en créant un canal d'exfiltration de données",
     chemins: [{id: SS1.1, texte: "canal d'exfiltration portant directement sur le SI de la R&D", pp: []}, {id: SS1.2, texte: "canal d'exfiltration sur le SI du laboratoire, qui détient une partie des travaux", pp: [P3]}, {id: SS1.3, texte: "canal d'exfiltration passant par le prestataire informatique", pp: [F3]}]}
  - {id: SS2, so: SO1, gravite: 4, source: "ANSSI-EBIOS p. 51",
     libelle: "Un activiste perturbe la production ou la distribution de vaccins",
     chemins: [{id: SS2.1, texte: "arrêt de la production industrielle par compromission de l'équipement de maintenance du fournisseur de matériel", pp: [F2]}, {id: SS2.2, texte: "modification de l'étiquetage des vaccins", pp: []}]}
  - {id: SS3, so: SO5, gravite: 4, source: "Original",
     libelle: "Un cybercriminel paralyse la production et la distribution par un rançongiciel",
     chemins: [{id: SS3.1, texte: "rançongiciel déployé à partir du prestataire informatique, qui dispose de droits élevés sur le SI", pp: [F3]}, {id: SS3.2, texte: "rançongiciel déployé après hameçonnage direct des salariés, avec propagation vers la production et la traçabilité", pp: []}]}

# Risques. R1 à R5 : scénarios, gravités et vraisemblances du guide (pp. 67, 73).
# R6 et R7 : ajoutés par ce projet. Le niveau résiduel de chaque risque est une estimation de ce projet,
# sauf le maintien de R3 à un niveau élevé (décision de la direction, p. 80).
risques:
  - id: R1
    libelle: "Un concurrent vole des informations de R&D grâce à un canal d'exfiltration direct"
    chemin: SS1.1
    er: ER3
    gravite: 3
    vraisemblance: 3
    source: "ANSSI-EBIOS p. 72, p. 67"
    residuel: {gravite: 3, vraisemblance: 2}
    justification_residuel: "Les mesures M01, M07, M08, M11, N01, N02, N03 ferment les trois modes opératoires (hameçonnage, salarié corrompu, clé USB piégée) mais un salarié corrompu reste possible"
  - id: R2
    libelle: "Un concurrent vole des informations de R&D en exfiltrant celles détenues par le laboratoire"
    chemin: SS1.2
    er: ER3
    gravite: 3
    vraisemblance: 2
    source: "ANSSI-EBIOS p. 72, p. 67"
    residuel: {gravite: 3, vraisemblance: 1}
    justification_residuel: "M06 (déjà terminée) réduit les données détenues par les laboratoires ; M03, M05 et M10 encadrent le laboratoire et l'interconnexion"
  - id: R3
    libelle: "Un concurrent vole des informations de R&D grâce à un canal d'exfiltration via le prestataire informatique"
    chemin: SS1.3
    er: ER3
    gravite: 3
    vraisemblance: 4
    source: "ANSSI-EBIOS p. 72, p. 67"
    residuel: {gravite: 3, vraisemblance: 3}
    justification_residuel: "La direction maintient ce risque à un niveau élevé : le prestataire résiste aux mesures de sécurité, qui changent ses méthodes de travail (p. 80). Les mesures ramènent la vraisemblance de 4 à 3 seulement"
    acceptation: {par: "Direction générale", date: 2026-09-30, revue: 2027-03-31, echeance_decision: 2027-03-31, decision_prevue: "Entrer au capital du prestataire pour modifier sa gouvernance de sécurité, ou changer de prestataire (p. 81)", source: "ANSSI-EBIOS p. 80-81 pour la décision et la piste ; dates et responsable : Original"}
  - id: R4
    libelle: "Un activiste provoque un arrêt de la production des vaccins en compromettant l'équipement de maintenance du fournisseur de matériel"
    chemin: SS2.1
    er: ER6
    gravite: 4
    vraisemblance: 2
    source: "ANSSI-EBIOS p. 72, p. 67"
    residuel: {gravite: 4, vraisemblance: 1}
    justification_residuel: "M13 fournit du matériel de maintenance maîtrisé par la DSI, M09 durcit le système industriel : la vraisemblance tombe à 1. La gravité reste 4 : un arrêt long en pic d'épidémie garde le même impact"
  - id: R5
    libelle: "Un activiste perturbe la distribution de vaccins en modifiant leur étiquetage"
    chemin: SS2.2
    er: ER6
    gravite: 4
    vraisemblance: 1
    source: "ANSSI-EBIOS p. 72, p. 67"
    residuel: {gravite: 3, vraisemblance: 1}
    justification_residuel: "N10 (double contrôle et intégrité de l'étiquetage) détecte l'altération avant expédition : la distribution n'est plus interrompue plus d'une semaine, la gravité passe à 3"
  - id: R6
    libelle: "Un cybercriminel paralyse la production par un rançongiciel déployé à partir du prestataire informatique"
    chemin: SS3.1
    er: ER6
    gravite: 4
    vraisemblance: 4
    source: "Original"
    residuel: {gravite: 3, vraisemblance: 2}
    justification_residuel: "N04, N05, N01 gênent le déploiement depuis le prestataire ; N06 (sauvegardes hors ligne testées) et M12 (continuité) ramènent l'interruption sous une semaine, donc gravité 3"
  - id: R7
    libelle: "Un cybercriminel paralyse la production par un rançongiciel après hameçonnage direct des salariés"
    chemin: SS3.2
    er: ER6
    gravite: 4
    vraisemblance: 3
    source: "Original"
    residuel: {gravite: 3, vraisemblance: 2}
    justification_residuel: "M01, N07, N03, N01 réduisent la probabilité de compromission et de propagation ; N06 et M12 limitent la durée d'interruption"

# Atelier 4. Modes opératoires. Vraisemblance élémentaire (v) de chaque action, de 1 à 4 ;
# vraisemblance d'un mode = la plus faible de ses actions ; du scénario = celle du mode de moindre effort
# pour l'attaquant (guide p. 65). "socle" = règles d'hygiène dont l'écart facilite l'action (guide p. 28).
# R1 : modes décrits dans le guide (p. 64) ; cotations élémentaires : Original.
# R2 à R7 : modes et cotations : Original ; la vraisemblance globale de R2 à R5 est celle du guide (p. 67).
operationnels:
  R1:
    modes:
      - nom: "Hameçonnage du service RH ou canal préexistant, latéralisation, exfiltration"
        actions: [{t: "Reconnaissance externe par sources ouvertes", v: 4, socle: []}, {t: "Intrusion par message d'hameçonnage sur la messagerie RH", v: 3, socle: [2, 24]}, {t: "Reconnaissance du réseau bureautique du site de Paris", v: 3, socle: [4]}, {t: "Latéralisation vers le réseau de la R&D", v: 3, socle: [19]}, {t: "Exploitation d'un maliciel de collecte et d'exfiltration", v: 3, socle: [14, 34, 36]}]
      - nom: "Corruption d'un salarié de la R&D"
        actions: [{t: "Reconnaissance externe avancée", v: 2, socle: []}, {t: "Corruption d'un salarié de l'équipe R&D", v: 2, socle: [2]}, {t: "Vol des données depuis le poste, sans supervision", v: 4, socle: [9, 36]}]
      - nom: "Corruption du personnel d'entretien, clé USB piégée"
        actions: [{t: "Reconnaissance externe avancée", v: 2, socle: []}, {t: "Corruption d'un prestataire d'entretien des locaux", v: 3, socle: [26]}, {t: "Clé USB piégée connectée sur un poste de R&D", v: 3, socle: [15, 26]}, {t: "Vol et exploitation des données de R&D", v: 4, socle: [9, 36]}]
  R2:
    modes:
      - nom: "Compromission du SI du laboratoire, exfiltration des copies de travaux"
        actions: [{t: "Reconnaissance des laboratoires partenaires (publications, sites)", v: 4, socle: []}, {t: "Compromission du SI du laboratoire (hameçonnage, vulnérabilité)", v: 2, socle: [3]}, {t: "Exfiltration des données de R&D que le laboratoire détient", v: 3, socle: [25]}]
      - nom: "Rebond par l'interconnexion avec le laboratoire"
        actions: [{t: "Compromission du laboratoire", v: 2, socle: [3]}, {t: "Passage par l'interconnexion non filtrée vers la R&D", v: 2, socle: [25, 19]}, {t: "Exfiltration des données", v: 3, socle: [36]}]
  R3:
    modes:
      - nom: "Compromission du prestataire informatique et usage de ses accès"
        actions: [{t: "Reconnaissance du prestataire informatique", v: 4, socle: []}, {t: "Compromission du SI du prestataire, dont la sécurité est faible", v: 4, socle: [3]}, {t: "Usage des droits d'accès élevés du prestataire sur les serveurs de R&D", v: 4, socle: [5, 8, 13]}, {t: "Exfiltration par un canal de maintenance", v: 4, socle: [36]}]
      - nom: "Corruption d'un employé du prestataire"
        actions: [{t: "Reconnaissance externe avancée", v: 2, socle: []}, {t: "Corruption d'un administrateur du prestataire", v: 2, socle: [3]}, {t: "Vol des données de R&D", v: 4, socle: [5, 36]}]
  R4:
    modes:
      - nom: "Compromission du fournisseur de matériel, puis de son équipement de maintenance"
        actions: [{t: "Reconnaissance du fournisseur de matériel", v: 4, socle: []}, {t: "Compromission du SI ou des postes du fournisseur", v: 3, socle: []}, {t: "Piégeage de l'équipement de maintenance utilisé sur le système industriel", v: 3, socle: [7]}, {t: "Connexion au réseau industriel sans cloisonnement", v: 3, socle: [19, 28]}, {t: "Modification des paramètres de production ou arrêt de la ligne", v: 2, socle: [12, 35]}]
      - nom: "Piégeage de l'équipement de maintenance chez le fournisseur"
        actions: [{t: "Accès à l'équipement en cours de fabrication ou de préparation", v: 2, socle: []}, {t: "Déclenchement lors de la maintenance sur site", v: 3, socle: [7]}, {t: "Arrêt de la ligne de production", v: 2, socle: [12, 35]}]
  R5:
    modes:
      - nom: "Propagation vers les serveurs de traçabilité et altération de l'étiquetage"
        actions: [{t: "Intrusion sur le réseau bureautique", v: 3, socle: [24, 14]}, {t: "Latéralisation vers les serveurs de traçabilité", v: 2, socle: [19]}, {t: "Altération des données d'étiquetage avant expédition", v: 1, socle: [9]}]
      - nom: "Corruption d'un opérateur de conditionnement"
        actions: [{t: "Corruption d'un opérateur", v: 2, socle: [2]}, {t: "Modification de l'étiquetage à la source", v: 1, socle: [9]}]
  R6:
    modes:
      - nom: "Compromission du prestataire informatique, déploiement du rançongiciel"
        actions: [{t: "Reconnaissance du prestataire informatique", v: 4, socle: []}, {t: "Compromission du SI du prestataire", v: 4, socle: [3]}, {t: "Usage des comptes privilégiés du prestataire", v: 4, socle: [5, 8, 13]}, {t: "Propagation aux serveurs de R&D, de production et de traçabilité", v: 4, socle: [19, 28]}, {t: "Chiffrement des systèmes et des sauvegardes", v: 4, socle: [37]}]
  R7:
    modes:
      - nom: "Hameçonnage direct, élévation de droits, propagation, chiffrement"
        actions: [{t: "Message d'hameçonnage envoyé aux salariés", v: 4, socle: [2, 24]}, {t: "Exécution du maliciel sur un poste, droits d'administration locaux", v: 3, socle: [14, 29]}, {t: "Propagation vers la production et la traçabilité", v: 3, socle: [19]}, {t: "Chiffrement des systèmes et des sauvegardes", v: 3, socle: [37]}]
      - nom: "Clé USB piégée déposée dans les locaux"
        actions: [{t: "Dépôt de clés USB piégées", v: 3, socle: [26]}, {t: "Exécution automatique sur un poste", v: 2, socle: [15]}, {t: "Propagation et chiffrement", v: 3, socle: [19, 37]}]
