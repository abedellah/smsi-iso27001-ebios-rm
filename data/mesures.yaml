# Plan de traitement du risque (EBIOS RM, atelier 5) et mesures du SMSI.
# M01 à M12 : les 12 mesures du plan du guide (p. 77) ; M13 : mesure sur l'écosystème du guide (p. 54).
# N01 à N13 : mesures ajoutées par ce projet.
# risques_anssi : rattachement donné par le guide ; risques : rattachement final de ce projet.
# regles : règles du Guide d'hygiène que la mesure traite. iso : mesures de l'Annexe A de l'ISO/IEC 27001:2022.
# cout : échelle de ce projet (Hypothèse) : + moins de 10 k€ ; ++ de 10 à 50 k€ ; +++ de 50 à 200 k€ ; ++++ plus de 200 k€.
# echeance_mois : délai après T0 (1er octobre 2026). charge en jours-homme.
# priorite : décision de ce projet ; priorite_anssi : seulement quand le guide la donne.
# statut : celui du guide pour M01 à M13 ; "À lancer" pour les mesures ajoutées.
mesures:
